name: AGS Sandbox Phase 0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-runner-calls-ags:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install cookbook dependencies
        working-directory: examples/github-actions-sandbox
        run: make setup

      - name: Run checked-out source in a fresh AGS sandbox
        id: ags
        working-directory: examples/github-actions-sandbox
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_DOMAIN: ${{ vars.E2B_DOMAIN || 'ap-guangzhou.tencentags.com' }}
        run: |
          make run \
            WORKSPACE="${GITHUB_WORKSPACE}" \
            COMMAND="python examples/github-actions-sandbox/workload/ci_task.py" \
            ARTIFACT_PATH="examples/github-actions-sandbox/workload/output" \
            OUTPUT_DIR="${RUNNER_TEMP}/ags-results"

      - name: Upload AGS run report and workload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ags-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ags-results
          if-no-files-found: warn
          retention-days: 7
