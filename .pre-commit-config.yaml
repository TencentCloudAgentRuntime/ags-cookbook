repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-yaml
        args: [--allow-multiple-documents]
        # These Helm templates and Harness !!js expressions are validated below.
        exclude: ^examples/dsh-awv-pelican/(deploy/helm/dsh-awv/templates/|images/(controller/|worker/profiles/)|plugin/dsh-agc/cordis\.patch\.yml$)
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: dsh-awv-config
        name: Validate AWV Helm and Harness configuration
        entry: make -C examples/dsh-awv-pelican check-config
        language: system
        pass_filenames: false
        files: ^examples/dsh-awv-pelican/.*\.(yaml|yml|json|mjs)$
