[project]
name = "agentcbs-volume"
version = "0.1.0"
description = "Start an AGS sandbox with an AgentCBS Volume mounted through a VolumeTemplate"
requires-python = ">=3.11"
dependencies = [
    # e2b 2.25-2.45 rejects AGS API keys (it requires the "e2b_" prefix).
    "e2b>=2.55.1",
    "e2b-code-interpreter>=2.11.5",
    "tencentcloud-sdk-python-common>=3.1.32",
]

[tool.uv]
package = false
