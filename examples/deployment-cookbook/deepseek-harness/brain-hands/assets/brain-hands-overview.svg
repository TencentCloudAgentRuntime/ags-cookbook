<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Brain–Hands deployment topology</title>
  <desc id="desc">Multiple stateless Brain replicas serve DSH Web and the API, store session state in MySQL, and use E2B to reach Hands. AGS retains the complete filesystem of each Hands instance.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0 0L10 3.5L0 7Z" fill="#2563eb"/>
    </marker>
    <style>
      .frame{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.node{fill:#fff;stroke:#2563eb;stroke-width:1.8}.db{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.8}.fs{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}.title{font:600 18px ui-sans-serif,system-ui,sans-serif;fill:#0f172a}.label{font:600 15px ui-sans-serif,system-ui,sans-serif;fill:#0f172a}.sub{font:13px ui-sans-serif,system-ui,sans-serif;fill:#475569}.edge{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#arrow)}.edge-label{font:600 12px ui-sans-serif,system-ui,sans-serif;fill:#1d4ed8}.frame-label{font:600 13px ui-sans-serif,system-ui,sans-serif;fill:#1d4ed8}
    </style>
  </defs>
  <rect width="1040" height="520" fill="#f8fafc"/>
  <rect width="1040" height="520" fill="url(#grid)"/>
  <text x="48" y="52" class="title">Stateless Brain, persistent Hands</text>

  <rect x="48" y="96" width="430" height="190" rx="18" class="frame"/>
  <text x="70" y="124" class="frame-label">Brain Deployment · ap-shanghai</text>
  <rect x="82" y="166" width="170" height="104" rx="12" class="node"/>
  <text x="167" y="207" text-anchor="middle" class="label">Brain replica</text>
  <text x="167" y="233" text-anchor="middle" class="sub">Web 3080 · API 8080</text>
  <rect x="274" y="166" width="170" height="104" rx="12" class="node"/>
  <text x="359" y="207" text-anchor="middle" class="label">Brain replica</text>
  <text x="359" y="233" text-anchor="middle" class="sub">Web 3080 · API 8080</text>
  <rect x="151" y="334" width="224" height="78" rx="12" class="db"/>
  <text x="263" y="366" text-anchor="middle" class="label">MySQL 8</text>
  <text x="263" y="390" text-anchor="middle" class="sub">DSH session state</text>
  <path d="M167 270V306H263V334" class="edge"/>
  <path d="M359 270V306H263V334" class="edge"/>

  <rect x="562" y="96" width="430" height="328" rx="18" class="frame"/>
  <text x="584" y="124" class="frame-label">Hands Deployment · ap-shanghai</text>
  <rect x="612" y="166" width="330" height="228" rx="12" class="node"/>
  <text x="777" y="201" text-anchor="middle" class="label">Hands instance · envd 49983</text>
  <rect x="640" y="242" width="274" height="118" rx="12" class="fs"/>
  <text x="777" y="287" text-anchor="middle" class="label">Complete filesystem</text>
  <text x="777" y="314" text-anchor="middle" class="sub">retained across PAUSE and resume</text>
  <text x="777" y="337" text-anchor="middle" class="sub">/workspace is the tool root</text>

  <path d="M444 218H612" class="edge"/>
  <rect x="497" y="196" width="62" height="24" rx="6" fill="#f8fafc"/>
  <text x="528" y="213" text-anchor="middle" class="edge-label">E2B</text>
</svg>
