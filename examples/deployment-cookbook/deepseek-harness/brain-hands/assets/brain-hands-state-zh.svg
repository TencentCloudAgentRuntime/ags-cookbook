.c-security-group { fill: none; stroke: #e11d48; stroke-dasharray: 4 4; }
.c-region { fill: #fbbf24; fill-opacity: 0.05; stroke: #d97706; stroke-dasharray: 8 4; }
.t-primary { fill: #0f172a; }
.t-muted { fill: #64748b; }
