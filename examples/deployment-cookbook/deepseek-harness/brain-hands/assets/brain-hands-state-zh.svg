<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" data-theme="light" viewBox="0 0 1040 600" role="img" lang="zh-CN" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
<style><![CDATA[@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: local('JetBrains Mono'), local('JetBrainsMono-Regular'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: local('JetBrains Mono'), local('JetBrainsMono-Regular'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 600; src: local('JetBrains Mono'), local('JetBrainsMono-Regular'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: local('JetBrains Mono'), local('JetBrainsMono-Regular'); }
svg { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', 'Noto Sans Mono CJK SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', monospace; }
g[id^='node-'] text[data-detail='context'] { font-size: 10px; }
g[data-edge-label] text { font-size: 11px; }
.c-grid { stroke: #e2e8f0; fill: none; }
.c-mask { fill: #ffffff; stroke: none; }
.c-frontend { fill: #22d3ee; fill-opacity: 0.15; stroke: #0891b2; }
