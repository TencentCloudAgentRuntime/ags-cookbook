apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-way-connect
  namespace: agent-way-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-way-connect
rules:
  - apiGroups: ["agent.agentway.io"]
    resources: ["agents", "agentsandboxproviders"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-way-connect
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-way-connect
subjects:
  - kind: ServiceAccount
    name: agent-way-connect
    namespace: agent-way-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-way-connect
  namespace: agent-way-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-way-connect
  namespace: agent-way-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-way-connect
subjects:
  - kind: ServiceAccount
    name: agent-way-connect
    namespace: agent-way-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-way-connect
  namespace: agent-way-system
  labels:
    app.kubernetes.io/name: agent-way-connect
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-way-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-way-connect
    spec:
      serviceAccountName: agent-way-connect
      containers:
        - name: agent-connect
          image: ccr.ccs.tencentyun.com/agentway/operator:v1.0.15-d5afc116
          imagePullPolicy: IfNotPresent
          command: ["./agent-way-connect"]
          args:
            - --bind-address=:9443
            - --system-namespace=agent-way-system
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 9443
              name: https
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-way-connect
  namespace: agent-way-system
spec:
  selector:
    app.kubernetes.io/name: agent-way-connect
  ports:
    - name: agent-connect
      port: 9443
      targetPort: https
      protocol: TCP
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.connect.agentway.io
spec:
  group: connect.agentway.io
  version: v1alpha1
  groupPriorityMinimum: 2000
  versionPriority: 20
  insecureSkipTLSVerify: true
  service:
    name: agent-way-connect
    namespace: agent-way-system
    port: 9443
