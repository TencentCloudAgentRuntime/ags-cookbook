apiVersion: agent.agentway.io/v1alpha1
kind: AgentProfile
metadata:
  name: openclaw-browser-profile
  namespace: default
spec:
  # 运行镜像：应包含 OpenClaw 主程序和 /init 入口。
  image: ccr.ccs.tencentyun.com/yaominxia/sandbox-openclaw-browser:v1.12
  # AGS/K8s Provider 都会以这里声明的命令作为容器启动入口。
  command: ["/init"]
  # Access 定义外部访问入口，最终会体现在 status.accessURL / Service / Ingress 上。
  access:
    port: 9000
    path: /
  # 可选: 放开更多端口
  # ports:
  #   - name: vnc
  #     port: 5900
  #     protocol: TCP
  startupProbe:
    httpGet:
      # AGS / K8s 当前都支持 httpGet 这一种探针形式。
      path: /ping
      port: 9000
    # 单次探测超时；超时后本次检查记为失败。
    timeoutSeconds: 2
    # 探测间隔；建议根据应用启动速度设置，示例为每 5 秒检查一次。
    periodSeconds: 5
    # 连续成功阈值，startupProbe 通常保持 1 即可。
    successThreshold: 1
    # 连续失败阈值；示例给 12 次，适合启动较慢的浏览器类 Agent。
    failureThreshold: 12
    # 注意：当前不支持 initialDelaySeconds / exec / tcpSocket / grpc / httpHeaders。
  # 为 Agent 预留持久化工作目录，OpenClaw 的配置、workspace、技能目录都挂在这里。
  # 未设置 subPath 时直接使用 AgentSandboxProvider 的 storage root；如需隔离或共享目录，请显式填写 subPath。
  volumeMounts:
    - name: openclaw-data
      mountPath: /openclaw
      # subPath: shared/openclaw # 可选：填写时就是 CFS/COS root 下的相对路径。
  # 插件安装/卸载命令模板。{{name}} 会在运行时替换成插件名。
    - name: shared
      mountPath: /shared
      subPath: shared-subpath
  pluginCommand:
    install: "openclaw plugins install {{name}}"
    uninstall: "openclaw plugins uninstall {{name}}"
  # Profile 级 env：所有引用这个 profile 的 Agent 都会继承这些变量。
  env:
    - key: AGENT_ROOT_DIR
      value: /openclaw/.openclaw
    - key: AGENT_WORKSPACE
      value: /openclaw/.openclaw/workspace
    - key: AGENT_SKILL_DIR
      value: /openclaw/.openclaw/workspace/skills
    - key: MODEL_API_KEY
      value: "sk-123"

---
apiVersion: agent.agentway.io/v1alpha1
kind: AgentTemplate
metadata:
  name: openclaw-browser-template
  namespace: default
spec:
  version: v1
  agentSpecTemplate:
    # 模版引用公共 profile，避免每个 Agent 重复声明镜像、启动命令、探针等基础参数。
    profileRef: openclaw-browser-profile
    # Template env 会和 Agent 自己声明的 env 按 key merge：
    # - 同 key 时 Agent 覆盖 Template
    # - 不同 key 会一起保留
    env:
      - key: MODEL_API_KEY
        value: "sk-from-template"
      - key: OPENCLAW_MODE
        value: "browser"
    resources:
      cpu: "2"
      memory: "4Gi"
    # 默认资源规格。当前推荐使用 K8s Quantity 风格字段。
    # 首次启动时执行的引导脚本，常用于安装依赖、初始化目录。
    bootstrapScripts:
      - name: install-skillhub
        interpreter: bash
        script: |
          export HOME=/openclaw
          export PATH="$HOME/.local/bin:/root/.local/bin:/.local/bin:$PATH"
          mkdir -p "$AGENT_ROOT_DIR" "$AGENT_WORKSPACE" "$AGENT_SKILL_DIR"
          curl -fsSL https://skillhub.cn/install/install.sh | bash -s -- --no-skills
    # SkillPack 描述一组希望注入到 Agent 中的技能。
    # skillPacks:
    #   - name: starter-skills
    #     installCommand: 'export HOME=/openclaw; export PATH="$HOME/.local/bin:/root/.local/bin:/.local/bin:$PATH"; if ! command -v skillhub >/dev/null 2>&1; then curl -fsSL https://skillhub.cn/install/install.sh | bash -s -- --no-skills; export PATH="$HOME/.local/bin:/root/.local/bin:/.local/bin:$PATH"; fi; skillhub --dir "$AGENT_SKILL_DIR" install {{name}} --force'
    #     skills:
    #       - self-improving
    # FileInjects 使用当前 CRD 的扁平结构：一条记录就是一个文件。
    fileInjects:
      - name: openclaw-agent-rules
        path: /openclaw/.openclaw/workspace/AGENTS.md
        content: |
          你是一个自带浏览器的 OpenClaw 智能体。
          你的任务是帮助用户浏览网页、总结信息、执行多步任务，并在执行前先说明你的计划。
        writeMode: overwrite
      - name: openclaw-model-config
        path: /openclaw/.openclaw/openclaw.json
        content: |
          {
            "agents": {
              "defaults": {
                "model": {
                  "primary":  "moonshot/kimi-k2.5"
                }
              }
            },
            "tools": {
              "profile": "full"
            },
            "models": {
              "mode": "merge",
              "providers": {
                "moonshot": {
                  "baseUrl": "https://api.moonshot.cn/v1",
                  "apiKey": "$MODEL_API_KEY",
                  "api": "openai-completions",
                  "models": [
                    {
                      "id": "kimi-k2.5",
                      "name": "kimi-k2.5",
                      "reasoning": false,
                      "input": ["text"],
                      "cost": {
                        "input": 0,
                        "output": 0,
                        "cacheRead": 0,
                        "cacheWrite": 0
                      },
                      "contextWindow": 204800,
                      "maxTokens": 204800
                    }
                  ]
                }
              }
            }
          }
        writeMode: merge

---
apiVersion: agent.agentway.io/v1alpha1
kind: Agent
metadata:
  name: openclaw-browser-agent
  namespace: default
  labels:
    app: openclaw-browser
spec:
  # Agent 只保留“个性化差异”：
  # 基础镜像、资源、bootstrap、默认技能等都来自 template。
  templateRef: openclaw-browser-template
  # 指定实际运行在哪个沙箱提供方上，这里是 Tencent AGS。
  sandboxProviderRef: openclaw-tencent-runtime
  # 可选: 关闭 AGS 平台为实例下发 access token（免 X-Access-Token 访问）
  # 默认值为 default（带 token）。改为 none 后 status.gatewayToken 会为空（大小写不敏感）。
  # authMode: none

---
apiVersion: agent.agentway.io/v1alpha1
kind: Agent
metadata:
  name: openclaw-browser-agent2
  namespace: default
  labels:
    app: openclaw-browser
spec:
  templateRef: openclaw-browser-template
  sandboxProviderRef: openclaw-tencent-runtime

---
apiVersion: agent.agentway.io/v1alpha1
kind: Agent
metadata:
  name: openclaw-browser-agent3
  namespace: default
  labels:
    app: openclaw-browser
spec:
  templateRef: openclaw-browser-template
  sandboxProviderRef: openclaw-tencent-runtime
  # Agent env 会和 Template env merge，用于按实例覆盖敏感信息或追加调试开关。
  env:
    - key: MODEL_API_KEY
      value: "sk-override-from-agent"
    - key: OPENCLAW_DEBUG
      value: "true"
