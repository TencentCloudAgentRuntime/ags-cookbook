apiVersion: v1
kind: Namespace
metadata:
  name: agent-way-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-infra
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-way-operator
  namespace: agent-way-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-way-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: agent-way-operator
    namespace: agent-way-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-way-operator-leader-election
  namespace: agent-way-system
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-way-operator-leader-election
  namespace: agent-way-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-way-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: agent-way-operator
    namespace: agent-way-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-way-operator
  namespace: agent-way-system
  labels:
    app.kubernetes.io/name: agent-way-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-way-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-way-operator
    spec:
      serviceAccountName: agent-way-operator
      containers:
        - name: agent-way-operator
          image: ccr.ccs.tencentyun.com/agentway/operator:v1.0.15-d5afc116
          imagePullPolicy: IfNotPresent
          args:
            - --health-probe-bind-address=:8381
            - --metrics-bind-address=:8383
            - --system-namespace=agent-way-system
            - --infra-namespace=agent-infra
            - --active-infra-provider=openclaw-tencent-runtime
            # Cookbook 使用静态清单，直接开启 controller-runtime Lease 抢主。
            - --leader-election=true
            - --leader-election-id=agent-way-operator-leader-election
            - --leader-election-namespace=agent-way-system
            - --leader-election-lease-duration=15s
            - --leader-election-renew-deadline=10s
            - --leader-election-retry-period=2s
            - --kube-api-qps=100
            - --kube-api-burst=200
            - --agentreplicaset-max-concurrent-reconciles=32
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8381
              name: health
              protocol: TCP
            - containerPort: 8383
              name: metrics
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 8000m
              memory: 8Gi
            limits:
              cpu: 8000m
              memory: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-way-operator-metrics
  namespace: agent-way-system
  labels:
    app.kubernetes.io/name: agent-way-operator
    app.kubernetes.io/component: metrics
spec:
  selector:
    app.kubernetes.io/name: agent-way-operator
  ports:
    - name: metrics
      port: 8383
      targetPort: metrics
      protocol: TCP
