apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-harness
  labels:
    app: dsh-harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsh-harness
  template:
    metadata:
      labels:
        app: dsh-harness
    spec:
      serviceAccountName: dsh-harness
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.nodes.controller }}
      nodeName: {{ .Values.nodes.controller | quote }}
      {{- end }}
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: harness
          image: {{ .Values.controller.image | quote }}
          imagePullPolicy: {{ .Values.controller.imagePullPolicy }}
          args:
            - dsh
            - --profile
            - agc-web
            - --patch
            - /opt/pelican/controller/web.patch.yml
            - --no-open
            {{- with .Values.controller.trustedHosts }}
            - --trusted-host
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3080
          env:
            - name: DSH_PERMISSION_MODE
              value: danger-full-access
            - name: DSH_AGC_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DSH_WORKSPACE_CLAIM
              value: pelican-workspace
            - name: DSH_WORKER_IMAGE
              value: {{ .Values.worker.image | quote }}
            - name: DSH_SITE_IMAGE
              value: {{ .Values.site.image | quote }}
            - name: DSH_SITE_SERVICE_TYPE
              value: {{ .Values.site.serviceType | quote }}
            - name: DSH_MODEL_SECRET
              value: {{ .Values.modelSecret | quote }}
            - name: DSH_IMAGE_PULL_SECRET
              value: {{ .Values.imagePullSecret | quote }}
            - name: DSH_CODE_NODE
              value: {{ .Values.nodes.code | quote }}
            - name: DSH_REVIEW_NODE
              value: {{ .Values.nodes.review | quote }}
            - name: DSH_SITE_NODE
              value: {{ .Values.nodes.site | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.modelSecret }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
